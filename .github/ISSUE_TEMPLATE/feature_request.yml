name: Feature request
description: Suggest a workflow, a statistic or a report improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        flaky-hunter is a single-file, dependency-free CLI. Proposals that keep it
        dependency-free, offline and deterministic are much more likely to be merged.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parsing (new CI result format)
        - Statistics / scoring
        - Reporting / rendering
        - Quarantine / baseline
        - CLI ergonomics
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be implemented with the Python standard library only
        - label: I am willing to open a pull request
